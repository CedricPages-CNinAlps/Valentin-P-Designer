<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Back Office</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-page">
<main class="login-wrapper">
  <div class="login-card">
    <div class="login-logo"><span class="admin-logo-text" id="loginLogoText">VP</span></div>
    <h1 class="login-title">Back Office</h1>
    <p class="login-subtitle">Connexion sécurisée à l'espace d'administration</p>
    <div class="admin-alert admin-alert-error" id="loginError" hidden role="alert"></div>
    <form class="login-form" id="loginForm" novalidate>
      <div class="admin-form-group">
        <label for="username" class="admin-label">Identifiant</label>
        <input type="text" id="username" class="admin-input" required autocomplete="username" placeholder="admin" autofocus>
      </div>
      <div class="admin-form-group">
        <label for="password" class="admin-label">Mot de passe</label>
        <div class="password-wrap">
          <input type="password" id="password" class="admin-input" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Afficher le mot de passe">
            <svg class="eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-hide" hidden xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary admin-btn-full">Se connecter</button>
    </form>
    <a href="../" class="login-back-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Retour au site
    </a>
  </div>
</main>
<script>
/* ---- Auth helpers ---- */
const DEFAULT_PWD = 'Admin2024!';
const DEFAULT_USER = 'admin';

async function sha256(msg) {
  const buf  = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function initAuth() {
  if (!localStorage.getItem('vp_auth')) {
    const hash = await sha256(DEFAULT_PWD);
    localStorage.setItem('vp_auth', JSON.stringify({ username: DEFAULT_USER, hash }));
  }
}

async function checkLogin(user, pwd) {
  const stored = JSON.parse(localStorage.getItem('vp_auth') || '{}');
  const hash   = await sha256(pwd);
  return user === (stored.username || DEFAULT_USER) && hash === stored.hash;
}

/* ---- Apply theme from config ---- */
(function() {
  try {
    const cfg = JSON.parse(localStorage.getItem('vp_config') || '{}');
    const c   = cfg.colors || {};
    const r   = document.documentElement.style;
    if (c.primary)   r.setProperty('--color-primary',   c.primary);
    if (c.secondary) r.setProperty('--color-secondary', c.secondary);
    if (c.light)     r.setProperty('--color-light',     c.light);
    const lt = cfg.site?.logo_text;
    if (lt) document.getElementById('loginLogoText').textContent = lt;
  } catch(e) {}
})();

/* ---- Init & form handler ---- */
initAuth();

document.getElementById('togglePwd').addEventListener('click', () => {
  const inp  = document.getElementById('password');
  const show = inp.type === 'password';
  inp.type   = show ? 'text' : 'password';
  document.querySelector('.eye-show').hidden = show;
  document.querySelector('.eye-hide').hidden = !show;
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('username').value.trim();
  const pwd  = document.getElementById('password').value;
  const ok   = await checkLogin(user, pwd);
  if (ok) {
    sessionStorage.setItem('vp_admin_session', '1');
    location.href = 'dashboard.html';
  } else {
    const err = document.getElementById('loginError');
    err.textContent = 'Identifiants incorrects.';
    err.hidden = false;
  }
});

/* Auto-redirect if already logged in */
if (sessionStorage.getItem('vp_admin_session') === '1') location.href = 'dashboard.html';
</script>
</body>
</html>
